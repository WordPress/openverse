services:
  playwright:
    build:
      context: .
      dockerfile: Dockerfile.playwright
      args:
        - PLAYWRIGHT_VERSION=${PLAYWRIGHT_VERSION}
    volumes:
      # Mount the whole monorepo, so that pnpm uses the root lockfile and the
      # frontend's workspace dependencies resolve.
      - ..:/ov:rw,Z
      # Keep the container's dependencies out of the host's `node_modules`.
      - root_node_modules:/ov/node_modules
      - node_modules:/ov/frontend/node_modules
      - api_client_node_modules:/ov/packages/js/api-client/node_modules
    user: ${USER_ID}
    working_dir: /ov/frontend
    entrypoint: >
      /bin/sh -c '
      pnpm install --frozen-lockfile --filter "@openverse/frontend..." &&
      pnpm ${TEST_COMMAND} ${PLAYWRIGHT_ARGS:-};
      '
    environment:
      # This makes the webserver that Playwright runs show the build
      - DEBUG=pw:webserver
      - UPDATE_TAPES=${UPDATE_TAPES:-false}
      - FASTSTART=${FASTSTART:-false}
      - PLAYWRIGHT_BASE_URL=${PLAYWRIGHT_BASE_URL:-}
      - HMAC_SIGNING_SECRET=${HMAC_SIGNING_SECRET:-}

volumes:
  root_node_modules:
  node_modules:
  api_client_node_modules:
