name: openverse/setup-env
description: Setup Openverse CI environment

inputs:
  setup_python:
    default: "true"
    description: Whether to set up Python and install dependencies

  setup_nodejs:
    default: "true"
    description: Whether to set up Node.js and dependencies

  locales:
    default: ""
    description: The locales to set up. "test" for copying from `frontend/test/locales`, "production" for downloading from GlotPress.

  install_recipe:
    default: "install"
    description: The recipe to use to install dependencies

runs:
  using: "composite"
  steps:
    # Just
    - name: Setup just
      uses: taiki-e/install-action@v2
      with:
        tool: just

    # Python
    - name: Setup Python
      if: inputs.setup_python == 'true'
      uses: actions/setup-python@v7
      with:
        # Ensure that it matches the `requires-python` field in various
        # `pyproject.toml` files.
        python-version: |
          3.11
          3.12

    - name: Setup global Python deps
      if: inputs.setup_python == 'true'
      shell: bash
      run: |
        pip install -U pip
        pip install pipenv

    - name: Setup uv
      if: inputs.setup_python == 'true'
      uses: astral-sh/setup-uv@v10.3.3
      with:
        # Keep in sync with `OV_UV_VERSION` in the root justfile.
        version: "0.13.5"

    - name: Setup pnpm
      if: inputs.setup_nodejs == 'true'
      shell: bash
      # Pinned so pnpm downloads are verified with current npm registry
      # signing keys (https://github.com/nodejs/corepack/issues/612).
      run: npm install -g corepack@0.35.0 && corepack enable pnpm

    - name: Setup Node.js
      if: inputs.setup_nodejs == 'true'
      uses: actions/setup-node@v7
      with:
        node-version-file: "package.json"
        cache: pnpm
        cache-dependency-path: |
          **/pnpm-lock.yaml
          **/.npmrc

    # Install dependencies
    - name: Install dependencies
      if: inputs.install_recipe != ''
      shell: bash
      run: |
        just ${{ inputs.install_recipe }}

    # Set up locales
    - name: Setup locales
      if: inputs.locales != ''
      shell: bash
      run: |
        just locales ${{ inputs.locales }}
