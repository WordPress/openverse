name: openverse/setup-env
description: Setup Openverse CI environment

inputs:
  setup_python:
    default: "true"
    description: Whether to set up Python and install dependencies

  setup_nodejs:
    default: "true"
    description: Whether to set up Node.js and dependencies

  locales:
    default: ""
    description: The locales to set up. "test" for copying from `frontend/test/locales`, "production" for downloading from GlotPress.

  install_recipe:
    default: "install"
    description: The recipe to use to install dependencies

runs:
  using: "composite"
  steps:
    # Just
    - name: Setup just
      uses: taiki-e/install-action@v2
      with:
        tool: just

    # Python
    - name: Setup Python
      if: inputs.setup_python == 'true'
      uses: actions/setup-python@v7
      with:
        # Ensure that it matches the `requires-python` field in various
        # `pyproject.toml` files.
        python-version: |
          3.11
          3.12

    - name: Setup global Python deps
      if: inputs.setup_python == 'true'
      shell: bash
      # pdm goes through pipx: `pdm[locked]` pins pdm's dependencies (so a
      # release of one of them cannot break it), and those pins conflict
      # with pipenv's requirements when both share one environment.
      run: |
        pip install -U pip
        pip install pipenv
        pipx install "pdm[locked]"

    - name: Setup uv
      if: inputs.setup_python == 'true'
      uses: astral-sh/setup-uv@v10.3.3
      with:
        # Keep in sync with `OV_UV_VERSION` in the root justfile.
        version: "0.13.5"

    - name: Setup pnpm
      if: inputs.setup_nodejs == 'true'
      shell: bash
      # Pinned so pnpm downloads are verified with current npm registry
      # signing keys (https://github.com/nodejs/corepack/issues/612).
      run: npm install -g corepack@0.35.0 && corepack enable pnpm

    - name: Setup Node.js
      if: inputs.setup_nodejs == 'true'
      uses: actions/setup-node@v7
      with:
        node-version-file: "package.json"
        cache: pnpm
        cache-dependency-path: |
          **/pnpm-lock.yaml
          **/.npmrc

    # Install dependencies
    - name: Install dependencies
      if: inputs.install_recipe != ''
      shell: bash
      run: |
        just ${{ inputs.install_recipe }}

    # Set up locales
    # GlotPress rate-limits the bulk translations download, so the downloaded
    # archive is cached and reused by every run within the same 2-hour window.
    # Older archives are restored as a fallback for when the download fails.
    - name: Get translations cache key
      id: i18n-cache-key
      if: inputs.locales == 'production'
      shell: bash
      run: |
        echo "window=$(( $(date -u +%s) / 7200 ))" >> "$GITHUB_OUTPUT"
        echo "path=${{ runner.temp }}/glotpress/openverse.zip" >> "$GITHUB_OUTPUT"

    - name: Restore cached translations
      id: i18n-cache
      if: inputs.locales == 'production'
      uses: actions/cache/restore@v4
      with:
        path: ${{ steps.i18n-cache-key.outputs.path }}
        key: glotpress-ngx-${{ steps.i18n-cache-key.outputs.window }}
        restore-keys: glotpress-ngx-

    - name: Setup locales
      id: locales
      if: inputs.locales != ''
      shell: bash
      env:
        I18N_NGX_CACHE: ${{ steps.i18n-cache-key.outputs.path }}
        I18N_NGX_CACHE_FRESH: ${{ steps.i18n-cache.outputs.cache-hit }}
      run: |
        marker="${{ runner.temp }}/i18n-start"
        touch "$marker"
        just locales ${{ inputs.locales }}
        if [ -n "$I18N_NGX_CACHE" ] && [ "$I18N_NGX_CACHE" -nt "$marker" ]; then
          echo "downloaded=true" >> "$GITHUB_OUTPUT"
        fi

    - name: Cache downloaded translations
      if: steps.locales.outputs.downloaded == 'true'
      uses: actions/cache/save@v4
      with:
        path: ${{ steps.i18n-cache-key.outputs.path }}
        key: glotpress-ngx-${{ steps.i18n-cache-key.outputs.window }}
