[project]
name = "openverse-documentation"
version = "0.0.0" # redundant for application
description = "Documentation for the Openverse project"
readme = "README.md"
license = {text = "MIT"}
authors = [
  {name = "Openverse Contributors", email = "openverse@wordpress.org"},
]

requires-python = "==3.14.*"
dependencies = []

[tool.uv]
package = false

[dependency-groups]
dev = [
  "furo >=2025.12.19, <2026",
  "myst-parser[linkify] >=5, <6",
  "sphinx >=9.2, <9.3",
  "sphinxcontrib-mermaid >=2, <2.2",
  "sphinx-autobuild >=2025.8.25, <2026",
  "sphinx-copybutton >=0.5.2, <0.6",
  "sphinx-notfound-page >=1.0.0, <2",
  "sphinx-reredirects >=1.1, <1.2",
]
