packages:
  - automations/js/
  - frontend/
  - packages/js/*

shamefullyHoist: true
enablePrePostScripts: true

# The host and the `ov` container (Linux) share `node_modules`, so install the
# native packages, like rolldown's bindings, for both.
supportedArchitectures:
  os: [current, darwin, linux]
  cpu: [current]
  libc: [current, glibc]

# Newly published versions are not resolved until they are 7 days old, to
# give the community time to catch compromised releases. Keep it in sync with
# the npm `minimumReleaseAge` in `.github/renovate.json5`. To take an urgent security fix earlier, add its exact version
# (`pkg@1.2.3`) to `minimumReleaseAgeExclude`, and remove it once it ages.
minimumReleaseAge: 10080

# None of these need their build scripts: esbuild and @swc/core ship their
# binaries as optional platform packages, and core-js only prints a banner.
allowBuilds:
  "@swc/core": false
  core-js: false
  esbuild: false

overrides:
  "@opentelemetry/api": ~1.10.0
  # Security overrides for transitive dependencies whose parents still pin
  # vulnerable ranges. Remove each one once its parents allow a patched version.
  "@tailwindcss/typography>postcss-selector-parser": ^6.1.5
  "talkback>uuid": ^11.1.1
  "glob@>=9 <14.0.2": ^14.0.2
  "minimatch@>=7 <11.0.1": ^11.0.5
minimumReleaseAgeExclude:
  # Renovate security update: nuxt@4.6.4
  - nuxt@4.6.4
